name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC # like most n8n servers — the clinic tests prove slot times are still Cairo-local
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow tests (JavaScript)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analytics tests (Python + SQL on SQLite and PostgreSQL)
        run: |
          pip install "psycopg[binary]==3.2.3"
          python -m unittest discover -s clinic-booking-system/analytics -v
